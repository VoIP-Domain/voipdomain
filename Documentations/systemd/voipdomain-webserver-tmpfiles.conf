# VoIP Domain administration server — installed by voipdomain-webserver only
# (requires nginx user; do not merge into voipdomain.conf — Asterisk nodes lack user nginx)
d /var/lib/voipdomain/storage 0755 nginx nginx -
d /var/lib/voipdomain/storage/avatars 0755 nginx nginx -
d /var/lib/voipdomain/storage/captures 0755 nginx nginx -
d /var/lib/voipdomain/storage/firmwares 0755 nginx nginx -
d /var/lib/voipdomain/storage/recordings 0755 nginx nginx -
d /var/lib/voipdomain/storage/sounds 0755 nginx nginx -
d /etc/voipdomain 0770 root nginx -
