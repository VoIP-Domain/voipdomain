# VoIP Domain Asterisk node — installed by voipdomain-client only
# (requires asterisk package; do not merge into voipdomain.conf — admin servers lack user asterisk)
d /var/spool/voipdomain 0755 asterisk asterisk -
d /var/spool/voipdomain/file-transfer 0755 asterisk asterisk -
d /var/lib/voipdomain/data 0750 asterisk asterisk -
