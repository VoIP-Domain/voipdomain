# VoIP Domain — NGiNX virtual host (RHEL / Rocky / AlmaLinux)
#
# Repository path: Documentations/etc/nginx/voipdomain.conf
# RPM install target: /etc/nginx/conf.d/voipdomain.conf
#
# Manual install:
#   cp Documentations/etc/nginx/voipdomain.conf /etc/nginx/conf.d/
#   cp Documentations/etc/nginx/voipdomain-fastcgi.conf /etc/nginx/
#   nginx -t && systemctl reload nginx
#
# PHP-FPM pool user is nginx — see Documentations/etc/php-fpm.d/voipdomain.conf
# Replace SERVER_NAME and SSL certificate paths before production use.

# HTTP → HTTPS
server {
    listen       80;
    listen       [::]:80;
    server_name  admin.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  admin.example.com;

    root         /var/lib/voipdomain/webroot;
    charset      utf-8;

    # Do not set "index index.php" — with try_files $uri/ nginx would internally
    # redirect GET / to /index.php, which location ~ \.php$ blocks with 404.

    # Paths to your certificate and key
    ssl_certificate     /etc/pki/tls/certs/voipdomain-admin.crt;
    ssl_certificate_key /etc/pki/tls/private/voipdomain-admin.key;

    # TLS — TLS 1.2+ for broad client compatibility (tighten to TLSv1.3 only if you control all clients)
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers (pragmatic admin UI — no CSP; the PHP app uses inline script/style in places)
    add_header          Strict-Transport-Security "max-age=31536000" always;
    add_header          X-Frame-Options "SAMEORIGIN" always;
    add_header          X-Content-Type-Options "nosniff" always;
    add_header          Referrer-Policy "strict-origin-when-cross-origin" always;

    # Log files
    access_log  /var/log/nginx/voipdomain-access.log combined;
    error_log   /var/log/nginx/voipdomain-error.log warn;

    # Maximum request body size
    client_max_body_size 128m;

    # Block access to any ".*" file
    location ~ /\. {
        deny all;
    }

    # Block direct access to PHP scripts (front-controller only)
    location ~ \.php$ {
        return 404;
    }

    # Restful API requests
    location /api/ {
        include        voipdomain-fastcgi.conf;
        fastcgi_pass   unix:/run/php-fpm/voipdomain.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/api.php;
    }

    # Calls recordings requests
    location /calls/ {
        include        voipdomain-fastcgi.conf;
        fastcgi_pass   unix:/run/php-fpm/voipdomain.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/calls.php;
    }

    # Static webroot assets (never pass to PHP — avoids text/html MIME on missing .js/.css)
    location ^~ /js/ {
        try_files $uri =404;
    }

    location ^~ /css/ {
        try_files $uri =404;
    }

    location ^~ /img/ {
        try_files $uri =404;
    }

    location ^~ /vendors/ {
        try_files $uri =404;
    }

    # Static files if present; everything else → index.php via FastCGI (not /index.php URL)
    location / {
        try_files $uri @vdmodules;
    }

    # Handler of page requests
    location @vdmodules {
        include        voipdomain-fastcgi.conf;
        fastcgi_pass   unix:/run/php-fpm/voipdomain.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
    }
}
