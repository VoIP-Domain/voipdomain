;;
;; VoIP Domain call routing contexts
;;
[VoIPDomain-Transhipment]
include => VoIPDomain-Hints

exten => _Z.,1,NoCDR()
 same => n,ExecIf(${DB_EXISTS(denylist-${EXTEN}/${CALLERID(num)})}?HangUp())
; ***TODO***: Decide whether to allow overflow to internal extensions on other servers, then implement it.
 same => n,ExecIf($["${DIALPLAN_EXISTS(VoIPDomain-Database,extension_${EXTEN})}" != "1"]?HangUp())
 same => n,GoSub(VoIPDomain-Database,extension_${EXTEN},1)
 same => n,Wait(${TRANSTIME})
 same => n,Dial(${dialstring},${MATH(${DIALTIME}-${TRANSTIME},int)},tTrcU(handler-VoIPDomain-pre-bridge))
 same => n,HangUp()

[VoIPDomain-Direct]
include => VoIPDomain-Hints

exten => _Z.,1,NoCDR()
 same => n,ExecIf(${DB_EXISTS(denylist-${EXTEN}/${CALLERID(num)})}?HangUp())
; ***TODO***: Decide whether to allow overflow to internal extensions on other servers, then implement it.
 same => n,ExecIf($["${DIALPLAN_EXISTS(VoIPDomain-Database,extension_${EXTEN})}" != "1"]?HangUp())
 same => n,GoSub(VoIPDomain-Database,extension_${EXTEN},1)
 same => n,Dial(${vd_dialstring},${MATH(${DIALTIME}-${TRANSTIME},int)},tTrcU(handler-VoIPDomain-pre-bridge))
 same => n,HangUp()

;;
;; Inbound from gateways (see gateways/client.php → fetch_config contexts public)
;;
[VoIPDomain-public]
exten => _X.,1,Verbose(1,${STRFTIME(${EPOCH},GMT+3,%c)}: VoIPDomain - Inbound public call to ${EXTEN} from ${CALLERID(num)})
 same => n,GoSub(VoIPDomain-Tools,call_extension,1(${EXTEN}))
 same => n,HangUp()
