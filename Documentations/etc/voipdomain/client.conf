[general]
version = 1.0
language = en_US
charset = UTF-8
confdir = /etc/asterisk/voipdomain/configs/
logfile = /var/log/voipdomain/client.log
privateKey = /etc/voipdomain/client-certificate.key
publicKey = /etc/voipdomain/client-certificate.pub
masterPublicKey = /etc/voipdomain/master-certificate.pub
address = 10.0.0.50           ; SIP/TFTP IP - REQUIRED for inter-server communication
tftpdir = /var/lib/tftpboot
datadir = /var/lib/voipdomain/data
soundsdir = /var/lib/asterisk/sounds/voipdomain
transferdir = /var/spool/voipdomain/file-transfer

[daemon]
serverid = 1
backup = false
key = 123deoliveira4
uid = asterisk
gid = asterisk
lpurl = https://voipdomain.voipdomain.io/lp
apiurl = https://voipdomain.voipdomain.io/api
debug = true

[mysql]
hostname = localhost
username = vd
password = mY9M3Xss
database = vdclient

[contexts]
exceptions = VoIPDomain-Exceptions
centrals = VoIPDomain-Internal
public = VoIPDomain-public
transfer = VoIPDomain-Transhipment
direct = VoIPDomain-Direct
internal = VoIPDomain-Internal
services = VoIPDomain-Services
hints = VoIPDomain-Hints

[gearman]
hostname = localhost
port = 4730
; For remote Gearman server, use:
; hostname = admin.example.com
; port = 4730

[macros]
ng = VoIPDomain-NG
lcr = VoIPDomain-LCR
