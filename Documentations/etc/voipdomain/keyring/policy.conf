; VoIP Domain Plugin Signing Policy
; 
; This file controls how the system handles plugin signature verification.
;
; Available policies:
;   block           - Reject installation of unsigned or invalid-signature plugins (DEFAULT)
;   warn            - Allow installation but log a warning for unsigned/invalid plugins
;   allow_unsigned  - Allow all plugins regardless of signature status
;
; trust_embedded_keys: if true, the system will accept the developer.pub key
;   embedded inside the plugin package when the developer is not in the system
;   keyring. This is LESS secure as it cannot guarantee authenticity — use with
;   caution and only in development environments.
;
[signing]
policy = block
trust_embedded_keys = false
