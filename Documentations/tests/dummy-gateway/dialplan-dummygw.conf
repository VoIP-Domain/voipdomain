; VoIP Domain Dummy Gateway Dialplan
; Accepts all calls, waits 5s, answers and runs echo test

[dummygw-incoming]
exten => _X.,1,NoOp(Dummy Gateway - Incoming call to ${EXTEN} from ${CALLERID(all)})
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

exten => _[a-zA-Z].,1,NoOp(Dummy Gateway - Incoming call to ${EXTEN} from ${CALLERID(all)})
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; Catch-all for any other pattern
exten => _.,1,NoOp(Dummy Gateway - Incoming call to ${EXTEN} from ${CALLERID(all)})
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(vm-goodbye)
