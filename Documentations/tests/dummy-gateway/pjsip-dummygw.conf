; VoIP Domain Dummy Gateway for testing
; This gateway accepts all calls, waits 5s, answers and runs echo test

[dummygw]
type=endpoint
context=dummygw-incoming
disallow=all
allow=ulaw
allow=alaw
allow=g722
transport=transport-udp
aors=dummygw
from_user=dummygw
from_domain=localhost
direct_media=no

[dummygw]
type=aor
max_contacts=1
qualify_frequency=30
default_expiration=3600

[dummygw]
type=identify
endpoint=dummygw
match=127.0.0.1
